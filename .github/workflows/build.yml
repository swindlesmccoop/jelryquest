name: Build images

on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - addon_bridge/**
      - backend/**
      - docker/**
      - frontend/**
      - requirements.txt
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jelryquest
            dockerfile: Dockerfile
          - image: jelryquest-addon-bridge
            dockerfile: addon_bridge/Dockerfile
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/swindlesmccoop/${{ matrix.image }}:latest
            ghcr.io/swindlesmccoop/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
