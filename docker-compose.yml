services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: jelryquest
    hostname: jelryquest
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      # Avoid Magic DNS in the sidecar namespace (often breaks resolution before TS is up)
      TS_ACCEPT_DNS: "false"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      caddy:
        aliases:
          - jelryquest
      default:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tailscale status --json | grep -q '\"BackendState\":\"Running\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  # tailscale up rejects short hostnames (e.g. "regxa") before login; set exit node after auth.
  exit-node-config:
    image: tailscale/tailscale:latest
    network_mode: service:tailscale
    environment:
      TS_EXIT_NODE: ${TS_EXIT_NODE}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sock=/tmp/tailscaled.sock
        echo "Waiting for tailscale backend..."
        for i in $(seq 1 90); do
          if tailscale --socket="$$sock" status --json 2>/dev/null | grep -q '"BackendState":"Running"'; then
            break
          fi
          sleep 2
        done
        if ! tailscale --socket="$$sock" status --json | grep -q '"BackendState":"Running"'; then
          echo "tailscale backend not running"
          exit 1
        fi
        echo "Setting exit node to $$TS_EXIT_NODE"
        tailscale --socket="$$sock" set --exit-node="$$TS_EXIT_NODE" --exit-node-allow-lan-access
        tailscale --socket="$$sock" status
    depends_on:
      tailscale:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    network_mode: service:tailscale
    volumes:
      - ${DOWNLOAD_PATH_MOVIES:-${DOWNLOAD_PATH:-./downloads/movies}}:/downloads/movies
      - ${DOWNLOAD_PATH_SERIES:-./downloads/series}:/downloads/series
    environment:
      STREMIO_ADDON_MANIFEST_URL: ${STREMIO_ADDON_MANIFEST_URL}
      REAL_DEBRID_API_TOKEN: ${REAL_DEBRID_API_TOKEN:-}
      DOWNLOAD_DIR: /downloads/movies
      DOWNLOAD_DIR_MOVIES: /downloads/movies
      DOWNLOAD_DIR_SERIES: /downloads/series
      EXPECTED_EGRESS_IP: ${EXPECTED_EGRESS_IP}
      EGRESS_CHECK_URL: ${EGRESS_CHECK_URL:-https://api.ipify.org}
      EGRESS_CHECK_STRICT: ${EGRESS_CHECK_STRICT:-true}
      MAX_ACTIVE_DOWNLOADS: ${MAX_ACTIVE_DOWNLOADS:-1}
      WEB_PORT: ${WEB_PORT:-8080}
    depends_on:
      tailscale:
        condition: service_healthy
      exit-node-config:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
  default:
    driver: bridge
