services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: jelryquest
    hostname: jelryquest
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      # Avoid Magic DNS in the sidecar namespace (often breaks resolution before TS is up)
      TS_ACCEPT_DNS: "false"
      # Kernel TUN required: userspace mode does not route arbitrary app TCP through exit node.
      TS_USERSPACE: "false"
      # TS_EXIT_NODE must be the VPS 100.x Tailscale IP (short names fail at boot).
      TS_EXTRA_ARGS: --exit-node=${TS_EXIT_NODE} --exit-node-allow-lan-access
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      caddy:
        aliases:
          - jelryquest
      default:
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tailscale --socket=/tmp/tailscaled.sock status 2>/dev/null | grep -qE '100\\.'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # Torrentio blocks VPS/datacenter IPs; this sidecar fetches addons via home WAN.
  addon-bridge:
    build:
      context: .
      dockerfile: addon_bridge/Dockerfile
    networks:
      default:
    restart: unless-stopped

  app:
    build: .
    network_mode: service:tailscale
    volumes:
      - ${DOWNLOAD_PATH_MOVIES:-${DOWNLOAD_PATH:-./downloads/movies}}:/downloads/movies
      - ${DOWNLOAD_PATH_SERIES:-./downloads/series}:/downloads/series
      - jelryquest-cache:/cache
    environment:
      STREMIO_ADDON_MANIFEST_URL: ${STREMIO_ADDON_MANIFEST_URL}
      REAL_DEBRID_API_TOKEN: ${REAL_DEBRID_API_TOKEN:-}
      REAL_DEBRID_API_BASE: ${REAL_DEBRID_API_BASE:-https://api.real-debrid.com/rest/1.0}
      REAL_DEBRID_REMOTE: ${REAL_DEBRID_REMOTE:-0}
      REAL_DEBRID_PREFERRED_CDN: ${REAL_DEBRID_PREFERRED_CDN:-}
      REAL_DEBRID_AUTO_SCAN: ${REAL_DEBRID_AUTO_SCAN:-1}
      REAL_DEBRID_SCAN_SECONDS: ${REAL_DEBRID_SCAN_SECONDS:-6.0}
      REAL_DEBRID_SCAN_WORKERS: ${REAL_DEBRID_SCAN_WORKERS:-8}
      REAL_DEBRID_SCAN_HOSTS: ${REAL_DEBRID_SCAN_HOSTS:-}
      REAL_DEBRID_SCAN_TOP: ${REAL_DEBRID_SCAN_TOP:-20}
      REAL_DEBRID_SCAN_CONNECT_TIMEOUT_SEC: ${REAL_DEBRID_SCAN_CONNECT_TIMEOUT_SEC:-8}
      REAL_DEBRID_SCAN_CACHE_TTL_SEC: ${REAL_DEBRID_SCAN_CACHE_TTL_SEC:-86400}
      REAL_DEBRID_CONNECT_TIMEOUT_SEC: ${REAL_DEBRID_CONNECT_TIMEOUT_SEC:-15}
      REAL_DEBRID_READ_TIMEOUT_SEC: ${REAL_DEBRID_READ_TIMEOUT_SEC:-60}
      CACHE_DIR: /cache
      DOWNLOAD_DIR: /downloads/movies
      DOWNLOAD_DIR_MOVIES: /downloads/movies
      DOWNLOAD_DIR_SERIES: /downloads/series
      EXPECTED_EGRESS_IP: ${EXPECTED_EGRESS_IP:-}
      EGRESS_CHECK_URL: ${EGRESS_CHECK_URL:-https://api.ipify.org}
      EGRESS_CHECK_STRICT: ${EGRESS_CHECK_STRICT:-true}
      PUBLIC_RESOLVERS: ${PUBLIC_RESOLVERS:-0}
      MAX_ACTIVE_DOWNLOADS: ${MAX_ACTIVE_DOWNLOADS:-1}
      WEB_PORT: ${WEB_PORT:-8080}
    depends_on:
      tailscale:
        condition: service_healthy
      addon-bridge:
        condition: service_started
    restart: unless-stopped

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
  default:
    driver: bridge

volumes:
  jelryquest-cache:
