<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JelryQuest</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>JelryQuest</h1>
      <p id="cdn-status" class="status"></p>
    </header>

    <main>
      <section>
        <div class="mode-toggle" role="tablist" aria-label="Search type">
          <button type="button" class="mode-btn active" data-mode="movie" role="tab" aria-selected="true">Movie</button>
          <button type="button" class="mode-btn" data-mode="series" role="tab" aria-selected="false">Show</button>
        </div>
        <form id="search-form" class="row">
          <input type="text" id="query" placeholder="Movie name…" autocomplete="off" required />
          <button type="submit">Search</button>
        </form>
      </section>

      <section id="browser" class="hidden">
        <div class="browser-header">
          <button type="button" id="back-btn" class="secondary hidden">← Back</button>
          <h2 id="browser-title">Results</h2>
        </div>
        <div id="browser-body"></div>
      </section>

      <section>
        <h2>Paste link</h2>
        <p class="meta">
          Magnet, info hash, <code>real-debrid.com</code> page link, or direct download URL.
          Saves to the folder for the Movie / Show mode selected above.
        </p>
        <form id="paste-form">
          <textarea id="paste-link" rows="3" autocomplete="off"
            placeholder="magnet:?xt=urn:btih:… or https://real-debrid.com/d/… or https://…"></textarea>
          <input type="text" id="paste-title" placeholder="Optional filename title" autocomplete="off" />
          <div class="actions"><button type="submit">Download link</button></div>
        </form>
      </section>

      <section>
        <h2>Downloads</h2>
        <ul id="downloads"></ul>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
